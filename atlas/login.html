<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RA Synovium Atlas · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="users.js"></script>
<script src="auth.js" data-root="./"></script>
<style>
  :root { --bg:#07080c; --panel:#0f1118; --line:#232736; --fg:#eef0f6; --mut:#8d93a6; --cyan:#22d3e6; --err:#ff6b7a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font:15px/1.55 Inter, -apple-system, system-ui, sans-serif; -webkit-font-smoothing:antialiased; display:grid; place-items:center; overflow:hidden; }
  .bg { position:fixed; inset:-4%; background:url(img/hero.jpg) center/cover no-repeat; filter:saturate(1.1); animation:drift 48s ease-in-out infinite alternate; }
  @keyframes drift { from { transform:scale(1.04); } to { transform:scale(1.14) translate(-2.5%,-2%); } }
  @media (prefers-reduced-motion:reduce) { .bg { animation:none; } }
  .scrim { position:fixed; inset:0; background:radial-gradient(ellipse at center, rgba(7,8,12,.55) 0%, rgba(7,8,12,.92) 70%); }
  .box { position:relative; z-index:2; width:min(380px, calc(100vw - 32px)); padding:34px 30px 28px; border-radius:18px;
         background:rgba(15,17,24,.72); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.09); }
  .eyebrow { font-size:11.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--cyan); margin-bottom:10px; }
  h1 { font-family:"Instrument Serif", Georgia, serif; font-weight:400; font-size:40px; line-height:1; margin:0 0 8px; }
  p.sub { color:var(--mut); font-size:13.5px; margin:0 0 24px; }
  label { display:block; font-size:12px; color:var(--mut); margin:0 0 6px; letter-spacing:.04em; }
  input { width:100%; font:inherit; color:var(--fg); background:rgba(7,8,12,.6); border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:16px; outline:none; transition:border-color .2s; }
  input:focus { border-color:var(--cyan); }
  button { width:100%; font:inherit; font-weight:500; color:#07080c; background:var(--fg); border:0; border-radius:999px; padding:12px; cursor:pointer; margin-top:4px; transition:.2s; }
  button:hover { background:#fff; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:var(--err); font-size:13px; min-height:20px; margin-top:12px; text-align:center; }
  .foot { color:var(--mut); font-size:12px; margin-top:16px; text-align:center; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="scrim"></div>
<form class="box" id="f" autocomplete="on">
  <div class="eyebrow">Spatial atlas</div>
  <h1>RA Synovium Atlas</h1>
  <p class="sub">Sign in to explore the spatial viewers.</p>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Sign in</button>
  <div class="err" id="e" role="alert"></div>
  <div class="foot">Need access? Contact Shitong Sun, QMUL.</div>
</form>
<script>
  // 已登录直接进首页
  const next = new URLSearchParams(location.search).get("next");
  const go = () => { location.replace(next && next.startsWith("/") ? next : "index.html"); };
  if (window.atlasUser()) go();
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const b = document.getElementById("b"), err = document.getElementById("e");
    b.disabled = true; err.textContent = "";
    const ok = await window.atlasLogin(document.getElementById("u").value.trim(), document.getElementById("p").value);
    b.disabled = false;
    if (ok) go(); else err.textContent = "Incorrect username or password.";
  };
</script>
</body>
</html>
